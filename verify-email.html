<!DOCTYPE html>

<html lang="en">
<head>
<link href="/favicon.png" rel="icon" type="image/x-icon"/>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<meta content="Verify your Senku Pay email address using the six-digit verification code sent to your inbox." name="description"/>
<meta content="#07090d" name="theme-color"/>
<title>Verify Email | Senku Pay</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet"/>
<link href="verify-email.css?v=20260728-v3" rel="stylesheet"/>
<meta content="dark" name="color-scheme"/><link href="popup.css?v=20260728-v3" rel="stylesheet"/><link href="responsive.css?v=20260728-v3" rel="stylesheet"/></head>
<body class="senku-obsidian-amber page-verify-email" data-page="verify-email" data-ui-version="obsidian-amber-v3">
<div aria-hidden="true" class="glow glow1"></div>
<div aria-hidden="true" class="glow glow2"></div>
<div aria-hidden="true" class="glow glow3"></div>
<header>
<a aria-label="Return to Senku Pay home" class="logo" href="index.html">
<div aria-hidden="true" class="logo-box">S</div>
<div>
<h2>Senku Pay</h2>
<small>Modern Digital Payments</small>
</div>
</a>
</header>
<main>
<section aria-labelledby="verifyTitle" class="verify-card">
<div class="card-top">
<div aria-hidden="true" class="verify-icon">
<i class="fa-solid fa-shield-halved"></i>
</div>
<h1 id="verifyTitle">Verify Your Email</h1>
<p>
                    Enter the six-digit verification code sent to
                    <strong id="maskedEmail">your email address</strong>.
                </p>
</div>
<div aria-live="polite" class="form-message" hidden="" id="formMessage" role="alert"></div>
<form id="verifyForm" novalidate="">
<div aria-label="Six-digit verification code" class="otp-container" id="otpContainer" role="group">
<input aria-label="Verification digit 1" autocomplete="one-time-code" class="otp-input" inputmode="numeric" maxlength="1" type="text"/>
<input aria-label="Verification digit 2" class="otp-input" inputmode="numeric" maxlength="1" type="text"/>
<input aria-label="Verification digit 3" class="otp-input" inputmode="numeric" maxlength="1" type="text"/>
<input aria-label="Verification digit 4" class="otp-input" inputmode="numeric" maxlength="1" type="text"/>
<input aria-label="Verification digit 5" class="otp-input" inputmode="numeric" maxlength="1" type="text"/>
<input aria-label="Verification digit 6" class="otp-input" inputmode="numeric" maxlength="1" type="text"/>
</div>
<small aria-live="polite" class="otp-error" id="otpError"></small>
<div class="timer">
                    Code expires in
                    <span id="timer">02:00</span>
</div>
<div class="resend">
                    Didn't receive the code?

                    <button disabled="" id="resend-btn" type="button">
                        Resend OTP
                    </button>
</div>
<button class="verify-btn" id="verifyBtn" type="submit">
<i aria-hidden="true" class="fa-solid fa-check"></i>
<span>Verify Code</span>
</button>
</form>
<div class="security-note">
<i aria-hidden="true" class="fa-solid fa-lock"></i>
<p>
                    Never share your verification code with anyone. Senku Pay
                    support will never ask you to reveal it.
                </p>
</div>
<div class="bottom-text">
<a href="register.html">
<i aria-hidden="true" class="fa-solid fa-arrow-left"></i>
                    Back to Registration
                </a>
</div>
</section>
</main>
<script src="popup.js?v=20260728-v3"></script><script src="verify-email.js?v=20260728-v3"></script>
</body>
</html>
