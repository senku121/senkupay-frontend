<!DOCTYPE html>

<html lang="en">
<head>
<link href="/favicon.png" rel="icon" type="image/x-icon"/>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Sub Agent Login | Senku Pay</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet"/>
<link href="sub-agent-login.css" rel="stylesheet"/>
<meta content="dark" name="color-scheme"/><link href="popup.css" rel="stylesheet"/><link href="responsive.css" rel="stylesheet"/></head>
<body class="senku-obsidian-amber page-sub-agent-login" data-page="sub-agent-login" data-ui-version="obsidian-amber-v1">
<div class="agent-login-container">
<div class="agent-login-card">
<div class="agent-logo">
<div class="logo-box">

S

</div>
<h1>

Sub Agent Portal

</h1>
<p>

Authorized agents only

</p>
</div>
<form autocomplete="off" id="agentLoginForm">
<div class="input-group">
<i class="fa-solid fa-id-badge"></i>
<input id="agentUsername" placeholder="Username" type="text"/>
</div>
<div class="input-group">
<i class="fa-solid fa-lock"></i>
<input id="agentPassword" placeholder="Password" type="password"/>
<i class="fa-solid fa-eye password-eye"></i>
</div>
<button class="agent-login-btn">
<i class="fa-solid fa-right-to-bracket"></i>


Login


</button>
<a class="back-login" href="login.html">


Back to User Login

</a>
</form>
<!--=================================
        LOGIN POPUP
==================================-->
<div class="login-popup" id="loginPopup">
<div class="popup-box">
<div class="popup-icon success" id="popupIcon">
<i class="fa-solid fa-circle-check" id="popupIconElement"></i>
</div>
<h2 id="popupTitle">
            Success
        </h2>
<p id="popupMessage">
            Message
        </p>
<button id="popupBtn" type="button">
            Continue
        </button>
</div>
</div>
</div>
</div>
<script src="storage.js"></script><script src="popup.js"></script>
<script src="sub-agent-login.js"></script>
</body>
</html>
